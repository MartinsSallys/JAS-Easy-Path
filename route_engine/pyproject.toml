[project]
name = "route-engine"
version = "0.1.0"
description = "Route optimization engine for JAS Easy Path"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["route_engine*"]